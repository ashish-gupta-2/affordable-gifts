# Separate database so tests never touch local dev data.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/affordable_gifts_test}
spring.flyway.locations=classpath:db/migration
app.admin.api-key=test-admin-key
app.mail.from=shop@test.local
# Generous limits so the normal API tests never trip them; SecurityTest lowers them.
app.security.orders-per-hour=1000
app.security.admin-failures-per-15-min=1000
