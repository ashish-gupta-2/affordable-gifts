spring.application.name=affordable-gifts-backend

# Local development defaults. Override with environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/affordable_gifts}
spring.datasource.username=${DB_USERNAME:${user.name}}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Local default: seed the placeholder catalogue. In production run with
# SPRING_PROFILES_ACTIVE=prod so the dev seed is not applied.
spring.profiles.default=dev

# Admin API key. Empty means every /api/admin/** call is rejected.
app.admin.api-key=${ADMIN_API_KEY:}

# Order confirmation email through Gmail SMTP (a Google App Password, never the
# normal Gmail password). With GMAIL_USERNAME unset, emails are simply skipped.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${GMAIL_USERNAME:}

# Security: never leak internals in error responses, no server banner, no uploads.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
server.server-header=
spring.servlet.multipart.enabled=false

# Abuse limits per client IP (see RequestLimitFilter).
app.security.orders-per-hour=10
app.security.admin-failures-per-15-min=10
